version: '3.9'

services: 

  rustfs-server:
    image: rustfs/rustfs:latest
    container_name: rustfs_local
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /mnt/rustfs/data:/data
    command: /data
    environment:
      
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_LOG_LEVEL: info
    user: "root"

  # traefik:
  #   image: traefik:v3.0
  #   container_name: traefik
  #   ports:
  #     - "80:80"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro    
  #     - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
  #     - ./traefik/dynamic:/etc/traefik/dynamic:ro
  #   networks:
  #     - backend
  #   depends_on:
  #     - authservice
  #     - communityservice
  #   restart: unless-stopped

  redis:
    image: redis:8.4.0
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  mongodb:
    image: mongo:8.0
    container_name: mongodb  
    ports:
      - "27017:27017"
    volumes:
      - akiora_py_db_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      # Connects the UI to the 'redis' service defined above
      REDIS_HOSTS: local:redis:6379 
    ports:
      - 8082:8081 # Access the UI at http://localhost:8082
    depends_on:
      - redis
    networks:
      - backend



  bff:
    build:
      context: ./backend
      dockerfile: BFF/Dockerfile
    container_name: bff.api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:   
      USER_RPC_STREAM: user.rpc
      APP_NAME: bff.api    
    depends_on:   
      - redis    
      - mongodb 
    networks:
      - backend
    restart: unless-stopped
 
  authservice:
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    container_name: auth.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:   
      MONGODB_DB_NAME: auth_db      
      APP_NAME: auth.api
      LOG_LEVEL: INFO
    depends_on:   
      - redis    
      - mongodb 
    networks:
      - backend
    restart: unless-stopped

 


  communityworker:
    build:
      context: ./backend
      dockerfile: CommunityService/Dockerfile
    container_name: community.consumer
 
    env_file:
      - .env
    environment:   
      MONGODB_DB_NAME: community_db      
      APP_NAME: communityservice
      LOG_LEVEL: INFO
    depends_on:

      - redis
      - mongodb    
    networks:
      - backend
    restart: unless-stopped

  finderworker:
    build:
      context: ./backend
      dockerfile: FinderService/Dockerfile
    container_name: finder.consumer
 
    env_file:
      - .env
    environment:   
      MONGODB_DB_NAME: finder_db      
      APP_NAME: finderservice
      LOG_LEVEL: INFO
    depends_on:

      - redis
      - mongodb    
    networks:
      - backend
    restart: unless-stopped

  socketservice_rust:
    build:
        context: ./backend
        dockerfile: SocketServiceRust/Dockerfile
    container_name: SocketServiceRust
    ports: 
    - "8005:3000"
    env_file:
    - .env
    environment:   
        
        APP_NAME: SocketServiceRust
        LOG_LEVEL: INFO
    depends_on:
    - redis  
    networks:
    - backend
    restart: unless-stopped


version: "3.9"

services:
    redis:
        image: redis:8.4.0
        container_name: redis
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - akiora_redis_data:/data
        networks:
            - backend

    mongodb:
        image: mongo:latest
        container_name: mongodb
        ports:
            - "27017:27017"
        volumes:
            - akiora_mongo_data:/data/db
        networks:
            - backend
        restart: unless-stopped

    mongo-express:
        image: mongo-express
        container_name: mongo-express
        restart: always
        environment:
            ME_CONFIG_MONGODB_SERVER: mongodb
            ME_CONFIG_BASICAUTH_USERNAME: admin
            ME_CONFIG_BASICAUTH_PASSWORD: admin
            ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
        ports:
            - "8081:8081"
        depends_on:
            - mongodb
        networks:
            - backend

    redis-commander:
        image: rediscommander/redis-commander:latest
        restart: always
        environment:
            # Connects the UI to the 'redis' service defined above
            REDIS_HOSTS: local:redis:6379
        ports:
            - 8082:8081 # Access the UI at http://localhost:8082
        depends_on:
            - redis
        networks:
            - backend

volumes:
    akiora_redis_data:

    akiora_mongo_data:

networks:
    backend:
        driver: bridge

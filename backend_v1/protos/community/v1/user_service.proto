syntax = "proto3";

package community.v1.user;

message SearchRequest {
  string query = 1;
  int32 page_number = 2;
  int32 results_per_page = 3;
}

message Response {
  string query = 1;
  int32 page_number = 2;
  int32 results_per_page = 3;
}

service RP {
  rpc SendDog(SearchRequest) returns (Response);
}

services:
    redis:
        image: redis:8.4.0
        container_name: redis
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        networks:
            - backend

    mongodb:
        image: mongo:8.0
        container_name: mongodb
        ports:
            - "27017:27017"
        volumes:
            - akiora_py_db_data:/data/db
        networks:
            - backend
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    mongo-express:
        image: mongo-express
        container_name: mongo-express
        restart: always
        environment:
            ME_CONFIG_MONGODB_SERVER: mongodb
            ME_CONFIG_BASICAUTH_USERNAME: admin
            ME_CONFIG_BASICAUTH_PASSWORD: admin
            ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
        ports:
            - "8081:8081"
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - backend

    redis-commander:
        image: rediscommander/redis-commander:latest
        restart: always
        environment:
            # Connects the UI to the 'redis' service defined above
            REDIS_HOSTS: local:redis:6379
        ports:
            - 8082:8081 # Access the UI at http://localhost:8082
        depends_on:
            - redis
        networks:
            - backend
